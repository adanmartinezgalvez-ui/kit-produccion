<style>

}

  --good:#4cc17d; --warn:#f0a43a; --bad:#ff6b5e; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#121315; --panel:#1b1c1f; --ink:#ecebe8; --muted:#9a9da3; --line:#2d2f33; --field:#232428;
  --accent:#3cc7bd; --accent-ink:#5fd6cd; --on-accent:#06201f; --soft:#173634;
  --good:#4cc17d; --warn:#f0a43a; --bad:#ff6b5e; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--ui);font-size:15px;line-height:1.5;
  padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px));padding-block:22px 48px}
.app{max-width:1100px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
.hd{display:flex;flex-direction:column;gap:4px}
.eyebrow{font-family:var(--mono);font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--accent-ink)}
h1{font-family:var(--display);font-weight:800;font-size:clamp(26px,4vw,34px);line-height:1.08;letter-spacing:-.02em;margin:0;text-wrap:balance}
.sub{margin:0;color:var(--muted);max-width:64ch}
h2{font-size:12px;font-weight:600;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);margin:0}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px;align-items:start}

input[type=text],input[type=number],input[type=date],input[type=time],input[type=url],textarea,select{width:100%;min-width:0;font:inherit;font-weight:400;color:var(--ink);background:var(--field);border:1px solid var(--line);border-radius:8px;padding:9px 10px}

button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,a:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.big{font-family:var(--mono);font-size:clamp(28px,5vw,40px);font-weight:500;line-height:1.05;font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.kv{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.kv div{background:var(--field);border:1px solid var(--line);border-radius:10px;padding:10px 12px;display:flex;flex-direction:column;gap:2px;min-width:0}
.kv span{font-size:12px;color:var(--muted)}
.kv b{font-family:var(--mono);font-size:20px;font-weight:500;font-variant-numeric:tabular-nums}
.note{font-size:13px;color:var(--muted);margin:0}
.tbl{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:top}

.preview{background:var(--field);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.preview canvas,.preview img{display:block;width:100%;height:auto;max-width:100%}
.checker{background-color:#c9c9c9;background-image:linear-gradient(45deg,#a9a9a9 25%,transparent 25%),linear-gradient(-45deg,#a9a9a9 25%,transparent 25%),linear-gradient(45deg,transparent 75%,#a9a9a9 75%),linear-gradient(-45deg,transparent 75%,#a9a9a9 75%);background-size:20px 20px;background-position:0 0,0 10px,10px -10px,-10px 0}
.tag{font-family:var(--mono);font-size:11px;padding:2px 8px;border-radius:999px;border:1px solid var(--line);color:var(--muted);white-space:nowrap}
.toast{position:fixed;left:50%;bottom:calc(16px + env(safe-area-inset-bottom, 0px));transform:translateX(-50%);background:var(--ink);color:var(--panel);padding:10px 16px;border-radius:10px;font-size:14px;font-weight:600;z-index:50;max-width:calc(100% - 32px)}
.fb{display:flex;flex-direction:column;gap:10px}
.fb img{width:100%;border-radius:8px;border:1px solid var(--line)}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

.rate{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.r{font:700 18px/1 var(--ui);padding:20px 10px;border-radius:12px;border:none;cursor:pointer;color:#fff}
.r.good{background:#1d7f45}.r.ok{background:#a86a00}.r.ng{background:#b42318}
.pill{font:600 12px var(--ui);padding:4px 10px;border-radius:999px;border:none;cursor:pointer;color:#fff;white-space:nowrap}
.pill.good{background:#1d7f45}.pill.ok{background:#a86a00}.pill.ng{background:#b42318}
.x{width:28px;height:28px;border-radius:7px;border:1px solid var(--line);background:var(--field);color:var(--muted);cursor:pointer;font-size:16px}
table{min-width:560px}
</style>
<div class="app">
<header class="hd"><span class="eyebrow">Kit de producción</span><h1>Bitácora de Rodaje</h1><p class="sub">Registra cada toma con un toque mientras grabas y exporta la lista para editar más rápido.</p></header>

<div class="card">
  <div class="cols">
    <label class="f">Proyecto<input type="text" id="prj" value="Cápsula institucional"></label>
    <label class="f">Escena<input type="text" id="esc" value="1"></label>
    <label class="f">Toma<input type="number" id="tk" min="1" value="1"></label>
    <label class="f">Cámara<input type="text" id="cam" value="A"></label>
  </div>
  <label class="f">Nota de la toma <small>opcional: qué pasó, minuto bueno, problema de audio…</small><input type="text" id="note" placeholder="Ej. buena desde el segundo 12, pasó un camión al final"></label>
  <div class="rate">
    <button type="button" class="r good" data-r="Buena">Buena</button>
    <button type="button" class="r ok" data-r="Regular">Regular</button>
    <button type="button" class="r ng" data-r="NG">No sirve</button>
  </div>
</div>
<div class="card">
  <div class="row" style="justify-content:space-between"><h2>Tomas registradas</h2><span class="note" id="sum"></span></div>
  <div class="tbl"><table><thead><tr><th>Hora</th><th>Esc.</th><th class="n">Toma</th><th>Cám.</th><th>Calificación</th><th>Nota</th><th></th></tr></thead><tbody id="rows"></tbody></table></div>
  <div class="row">
    <button class="btn" type="button" id="csv">Descargar CSV</button>
    <button class="btn ghost" type="button" id="copy">Copiar solo las buenas</button>
    <button class="btn ghost" type="button" id="clr">Borrar bitácora</button>
  </div>
</div>

</div>
<script>
(function(){

const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
const store={get(k,d){try{const v=localStorage.getItem(k);return v==null?d:JSON.parse(v)}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
function toast(t){ let el=$(".toast"); if(!el){ el=document.createElement("div"); el.className="toast"; el.setAttribute("role","status"); document.body.appendChild(el); } el.textContent=t; el.hidden=false; clearTimeout(toast._t); toast._t=setTimeout(()=>el.hidden=true,2600); }
function seg(el, v, cb){ const set=val=>el.querySelectorAll("button").forEach(b=>b.setAttribute("aria-pressed", String(b.dataset.v===String(val)))); set(v); el.addEventListener("click",e=>{ const b=e.target.closest("button"); if(!b) return; set(b.dataset.v); cb(b.dataset.v); }); return set; }
let _dl=null; function dl(){ if(!_dl) _dl=(window.claude&&window.claude.use)?window.claude.use("downloads").catch(()=>null):Promise.resolve(null); return _dl; }
async function copyText(t){ try{ await navigator.clipboard.writeText(t); toast("Copiado"); return true; }catch(e){ const ta=document.createElement("textarea"); ta.value=t; ta.style.position="fixed"; ta.style.opacity="0"; document.body.appendChild(ta); ta.select(); let ok=false; try{ ok=document.execCommand("copy"); }catch(_){} ta.remove(); toast(ok?"Copiado":"Selecciona el texto y cópialo a mano"); return ok; } }
function fallbackBox(){ let fb=$("#fallback"); if(!fb){ fb=document.createElement("div"); fb.id="fallback"; fb.className="card fb"; $(".app").appendChild(fb); } fb.innerHTML=""; fb.hidden=false; return fb; }
async function showFallback(name, data){
  const fb=fallbackBox(); const h=document.createElement("h2"); h.textContent="Guardar a mano"; fb.appendChild(h);
  const p=document.createElement("p"); p.className="note"; fb.appendChild(p);
  if(data instanceof Blob && data.type.startsWith("image/")){ p.textContent="Aquí no se puede descargar directo. Mantén presionada la imagen (o clic derecho › Guardar imagen)."; const img=document.createElement("img"); img.alt=name; img.src=await new Promise(r=>{const fr=new FileReader(); fr.onload=()=>r(fr.result); fr.readAsDataURL(data);}); fb.appendChild(img); }
  else if(typeof data==="string"){ p.textContent="Aquí no se puede descargar directo. Copia el contenido:"; const ta=document.createElement("textarea"); ta.className="mono"; ta.value=data; ta.readOnly=true; fb.appendChild(ta); const b=document.createElement("button"); b.className="btn ghost sm"; b.type="button"; b.textContent="Copiar"; b.onclick=()=>copyText(data); fb.appendChild(b); }
  else { p.textContent="Aquí no se puede descargar este archivo. Abre la página dentro de claude.ai para guardarlo."; }
  fb.scrollIntoView({behavior:"smooth", block:"nearest"});
}
async function saveFile(name, data){
  const d=await dl();
  if(!d){ await showFallback(name, data); return false; }
  try{ await d.save({filename:name, data}); toast("Listo: "+name); return true; }
  catch(e){ const c=e&&e.code; if(c==="declined"){ toast("Descarga cancelada"); return false; } if(c==="rate_limited"){ toast("Ya hay una descarga pendiente"); return false; } await showFallback(name, data); return false; }
}
function canvasBlob(c, type, q){ return new Promise(r=>c.toBlob(r, type||"image/png", q)); }
function slug(t){ return (t||"archivo").normalize("NFD").replace(/[̀-ͯ]/g,"").toLowerCase().replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"").slice(0,60)||"archivo"; }
function readImage(file){ return new Promise((res,rej)=>{ const url=URL.createObjectURL(file); const im=new Image(); im.onload=()=>res(im); im.onerror=rej; im.src=url; }); }
function sampleImage(w,h,seed){
  // Escena de ejemplo generada (no es una foto real)
  const c=document.createElement("canvas"); c.width=w; c.height=h; const x=c.getContext("2d"); let s=seed||5; const r=()=>{ s=(s*16807)%2147483647; return s/2147483647; };
  let g=x.createLinearGradient(0,0,0,h); g.addColorStop(0,"#3d6fb6"); g.addColorStop(.55,"#f2b27a"); g.addColorStop(1,"#5a3b2e"); x.fillStyle=g; x.fillRect(0,0,w,h);
  x.fillStyle="rgba(255,236,200,.95)"; x.beginPath(); x.arc(w*.7,h*.42,h*.09,0,7); x.fill();
  for(let i=0;i<9;i++){ x.fillStyle=`rgba(${30+i*6},${34+i*5},${48+i*4},.92)`; const bw=w*(.07+r()*.08), bh=h*(.2+r()*.35); x.fillRect(i*w*.115, h*.62-bh, bw, bh+2); }
  x.fillStyle="#2d2a26"; x.fillRect(0,h*.62,w,h*.38);
  x.fillStyle="#d9d2c4"; for(let i=0;i<6;i++){ x.fillRect(w*(.08+i*.16), h*.8, w*.08, h*.012); }
  x.fillStyle="#1b1a18"; x.beginPath(); x.arc(w*.36,h*.52,h*.05,0,7); x.fill(); x.fillRect(w*.33,h*.56,w*.06,h*.2);
  return c;
}


let st=store.get("bit-v1",{log:[],prj:"Cápsula institucional",esc:"1",tk:1,cam:"A"});
["prj","esc","tk","cam"].forEach(k=>$("#"+k).value=st[k]);
["prj","esc","tk","cam"].forEach(k=>$("#"+k).addEventListener("input",()=>{ st[k]=$("#"+k).value; store.set("bit-v1",st); }));
const esc=t=>String(t).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const CLS={Buena:"good",Regular:"ok",NG:"ng"}, LBL={Buena:"Buena",Regular:"Regular",NG:"No sirve"};
function render(){
  $("#rows").innerHTML = st.log.length ? st.log.map((e,i)=>`<tr><td class="n">${e.t}</td><td>${esc(e.esc)}</td><td class="n">${e.tk}</td><td>${esc(e.cam)}</td><td><button type="button" class="pill ${CLS[e.r]}" data-i="${i}" title="Cambiar calificación">${LBL[e.r]}</button></td><td>${esc(e.n)}</td><td><button type="button" class="x" data-x="${i}" aria-label="Borrar toma">×</button></td></tr>`).join("")
    : `<tr><td colspan="7" class="note">Todavía no hay tomas. Al terminar cada toma, toca Buena, Regular o No sirve.</td></tr>`;
  const g=st.log.filter(e=>e.r==="Buena").length; $("#sum").textContent=`${st.log.length} tomas · ${g} buenas`;
  $$("#rows .pill").forEach(b=>b.addEventListener("click",()=>{ const e=st.log[+b.dataset.i], o=["Buena","Regular","NG"]; e.r=o[(o.indexOf(e.r)+1)%3]; save(); }));
  $$("#rows .x").forEach(b=>b.addEventListener("click",()=>{ st.log.splice(+b.dataset.x,1); save(); }));
}
function save(){ store.set("bit-v1",st); render(); }
$$(".rate .r").forEach(b=>b.addEventListener("click",()=>{
  const now=new Date(); st.log.unshift({t:now.toLocaleTimeString("es-MX",{hour12:false}), esc:$("#esc").value, tk:+$("#tk").value||1, cam:$("#cam").value, r:b.dataset.r, n:$("#note").value.trim()});
  st.tk=(+$("#tk").value||1)+1; $("#tk").value=st.tk; $("#note").value=""; save(); toast(`Toma ${st.log[0].tk}: ${LBL[b.dataset.r]}`); if(navigator.vibrate) try{navigator.vibrate(25);}catch(_){}
}));
const q=v=>`"${String(v).replace(/"/g,'""')}"`;
$("#csv").addEventListener("click",()=>{ if(!st.log.length){ toast("Aún no hay tomas"); return; } const rows=[["Proyecto","Hora","Escena","Toma","Cámara","Calificación","Nota"],...st.log.slice().reverse().map(e=>[st.prj,e.t,e.esc,e.tk,e.cam,LBL[e.r],e.n])]; saveFile(`bitacora-${slug(st.prj)}.csv`, "﻿"+rows.map(r=>r.map(q).join(",")).join("\n")); });
$("#copy").addEventListener("click",()=>{ const g=st.log.filter(e=>e.r==="Buena").slice().reverse(); if(!g.length){ toast("No hay tomas buenas todavía"); return; } copyText(`${st.prj} — tomas buenas\n`+g.map(e=>`Esc ${e.esc} · Toma ${e.tk} · Cám ${e.cam}${e.n?" · "+e.n:""}`).join("\n")); });
let arm=false; $("#clr").addEventListener("click",()=>{ const b=$("#clr"); if(!arm){ arm=true; b.textContent="Toca otra vez para borrar todo"; setTimeout(()=>{ arm=false; b.textContent="Borrar bitácora"; },3000); return; } st.log=[]; st.tk=1; $("#tk").value=1; arm=false; b.textContent="Borrar bitácora"; save(); });
render();

})();
</script>
