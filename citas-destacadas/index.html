<div class="app">
<header class="hd"><span class="eyebrow">Kit de producción</span><h1>Citas Destacadas</h1><p class="sub">Convierte una frase de la entrevista en una tarjeta para redes, con foto, nombre y cargo.</p></header>

<div class="grid wide">
  <div class="card">
    <h2>Contenido</h2>
    <label class="f">Cita<textarea id="q" style="min-height:90px">Prepararnos hoy es la mejor forma de cuidar a nuestras familias mañana.</textarea></label>
    <div class="cols"><label class="f">Nombre<input type="text" id="n" value="Jorge Ramírez Ortega"></label><label class="f">Cargo<input type="text" id="c" value="Coordinador de Protección Civil"></label></div>
    <label class="f">Foto de la persona<input type="file" id="ph" accept="image/*"></label>
    <label class="f">Logo <small>opcional, PNG</small><input type="file" id="lg" accept="image/*"></label>
    <label class="f">Formato<div class="seg" id="fmt"><button type="button" data-v="1080x1080">Cuadrado</button><button type="button" data-v="1080x1350">Vertical 4:5</button><button type="button" data-v="1080x1920">Historia 9:16</button></div></label>
    <label class="f">Estilo<div class="seg" id="sty"><button type="button" data-v="foto">Foto completa</button><button type="button" data-v="div">Foto y bloque</button><button type="button" data-v="color">Color</button></div></label>
    <div class="row"><label class="check"><input type="color" id="ac" value="#0b7a75"> Color principal</label><label class="check"><input type="color" id="hl" value="#ffd23f"> Comillas</label></div>
  </div>
  <div class="card">
    <div class="row" style="justify-content:space-between"><h2>Tarjeta</h2><button class="btn" type="button" id="dlb">Descargar PNG</button></div>
    <div class="preview" style="max-width:520px;align-self:center;width:100%"><canvas id="cv"></canvas></div>
    <p class="note" id="nt">Foto, nombre y cita de ejemplo: cámbialos por los reales.</p>
  </div>
</div>

</div>
<script>
(function(){

const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
const store={get(k,d){try{const v=localStorage.getItem(k);return v==null?d:JSON.parse(v)}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
function toast(t){ let el=$(".toast"); if(!el){ el=document.createElement("div"); el.className="toast"; el.setAttribute("role","status"); document.body.appendChild(el); } el.textContent=t; el.hidden=false; clearTimeout(toast._t); toast._t=setTimeout(()=>el.hidden=true,2600); }
function seg(el, v, cb){ const set=val=>el.querySelectorAll("button").forEach(b=>b.setAttribute("aria-pressed", String(b.dataset.v===String(val)))); set(v); el.addEventListener("click",e=>{ const b=e.target.closest("button"); if(!b) return; set(b.dataset.v); cb(b.dataset.v); }); return set; }
let _dl=null; function dl(){ if(!_dl) _dl=(window.claude&&window.claude.use)?window.claude.use("downloads").catch(()=>null):Promise.resolve(null); return _dl; }
async function copyText(t){ try{ await navigator.clipboard.writeText(t); toast("Copiado"); return true; }catch(e){ const ta=document.createElement("textarea"); ta.value=t; ta.style.position="fixed"; ta.style.opacity="0"; document.body.appendChild(ta); ta.select(); let ok=false; try{ ok=document.execCommand("copy"); }catch(_){} ta.remove(); toast(ok?"Copiado":"Selecciona el texto y cópialo a mano"); return ok; } }
function fallbackBox(){ let fb=$("#fallback"); if(!fb){ fb=document.createElement("div"); fb.id="fallback"; fb.className="card fb"; $(".app").appendChild(fb); } fb.innerHTML=""; fb.hidden=false; return fb; }
async function showFallback(name, data){
  const fb=fallbackBox(); const h=document.createElement("h2"); h.textContent="Guardar a mano"; fb.appendChild(h);
  const p=document.createElement("p"); p.className="note"; fb.appendChild(p);
  if(data instanceof Blob && data.type.startsWith("image/")){ p.textContent="Aquí no se puede descargar directo. Mantén presionada la imagen (o clic derecho › Guardar imagen)."; const img=document.createElement("img"); img.alt=name; img.src=await new Promise(r=>{const fr=new FileReader(); fr.onload=()=>r(fr.result); fr.readAsDataURL(data);}); fb.appendChild(img); }
  else if(typeof data==="string"){ p.textContent="Aquí no se puede descargar directo. Copia el contenido:"; const ta=document.createElement("textarea"); ta.className="mono"; ta.value=data; ta.readOnly=true; fb.appendChild(ta); const b=document.createElement("button"); b.className="btn ghost sm"; b.type="button"; b.textContent="Copiar"; b.onclick=()=>copyText(data); fb.appendChild(b); }

}
async function saveFile(name, data){
  const d=await dl();
  if(!d){ await showFallback(name, data); return false; }
  try{ await d.save({filename:name, data}); toast("Listo: "+name); return true; }
  catch(e){ const c=e&&e.code; if(c==="declined"){ toast("Descarga cancelada"); return false; } if(c==="rate_limited"){ toast("Ya hay una descarga pendiente"); return false; } await showFallback(name, data); return false; }
}
function canvasBlob(c, type, q){ return new Promise(r=>c.toBlob(r, type||"image/png", q)); }

function readImage(file){ return new Promise((res,rej)=>{ const url=URL.createObjectURL(file); const im=new Image(); im.onload=()=>res(im); im.onerror=rej; im.src=url; }); }
function sampleImage(w,h,seed){
  // Escena de ejemplo generada (no es una foto real)
  const c=document.createElement("canvas"); c.width=w; c.height=h; const x=c.getContext("2d"); let s=seed||5; const r=()=>{ s=(s*16807)%2147483647; return s/2147483647; };
  let g=x.createLinearGradient(0,0,0,h); g.addColorStop(0,"#3d6fb6"); g.addColorStop(.55,"#f2b27a"); g.addColorStop(1,"#5a3b2e"); x.fillStyle=g; x.fillRect(0,0,w,h);
  x.fillStyle="rgba(255,236,200,.95)"; x.beginPath(); x.arc(w*.7,h*.42,h*.09,0,7); x.fill();
  for(let i=0;i<9;i++){ x.fillStyle=`rgba(${30+i*6},${34+i*5},${48+i*4},.92)`; const bw=w*(.07+r()*.08), bh=h*(.2+r()*.35); x.fillRect(i*w*.115, h*.62-bh, bw, bh+2); }

  x.fillStyle="#d9d2c4"; for(let i=0;i<6;i++){ x.fillRect(w*(.08+i*.16), h*.8, w*.08, h*.012); }
  x.fillStyle="#1b1a18"; x.beginPath(); x.arc(w*.36,h*.52,h*.05,0,7); x.fill(); x.fillRect(w*.33,h*.56,w*.06,h*.2);
  return c;
}


let photo=null, logo=null, fmt="1080x1080", sty="foto";
seg($("#fmt"),fmt,v=>{fmt=v;draw();}); seg($("#sty"),sty,v=>{sty=v;draw();});
function portrait(){ const c=document.createElement("canvas"); c.width=900; c.height=1100; const x=c.getContext("2d");
  let g=x.createLinearGradient(0,0,900,1100); g.addColorStop(0,"#6f8597"); g.addColorStop(1,"#2c3640"); x.fillStyle=g; x.fillRect(0,0,900,1100);
  x.fillStyle="rgba(255,255,255,.08)"; for(let i=0;i<6;i++){ x.fillRect(80+i*140,0,60,1100); }
  x.fillStyle="#1d2a36"; x.beginPath(); x.ellipse(450,1130,360,330,0,0,7); x.fill();
  x.fillStyle="#b88466"; x.fillRect(395,560,110,130); x.beginPath(); x.ellipse(450,440,150,185,0,0,7); x.fill();
  x.fillStyle="#2a1d16"; x.beginPath(); x.ellipse(450,330,160,110,0,Math.PI,0); x.fill(); return c; }
const P0=portrait();
function cover(x,im,X,Y,W,H,fy){ const s=Math.max(W/im.width,H/im.height), w=im.width*s, h=im.height*s; x.drawImage(im,X+(W-w)/2,Y+(H-h)*(fy??0.3),w,h); }

function fitText(x,t,maxW,maxH,start,min,weight,fam,lh){ let fs=start, lines; do{ x.font=`${weight} ${fs}px ${fam}`; lines=wrap(x,t,maxW); if(lines.length*fs*lh<=maxH) break; fs-=2; } while(fs>min); return {fs,lines}; }
function draw(){
  const [W,H]=fmt.split("x").map(Number), cv=$("#cv"); cv.width=W; cv.height=H; const x=cv.getContext("2d"), im=photo||P0, ac=$("#ac").value, hl=$("#hl").value;
  const QF='"Bricolage Grotesque", "Helvetica Neue", Arial, sans-serif', NF='Figtree, Arial, sans-serif', q=$("#q").value.trim(), pad=W*0.08;
  let tx=pad, tw=W-pad*2, top, bottom, ink="#fff", sub="rgba(255,255,255,.82)";
  if(sty==="foto"){ cover(x,im,0,0,W,H); const g=x.createLinearGradient(0,H*0.25,0,H); g.addColorStop(0,"rgba(0,0,0,0)"); g.addColorStop(.55,"rgba(0,0,0,.72)"); g.addColorStop(1,"rgba(0,0,0,.88)"); x.fillStyle=g; x.fillRect(0,0,W,H); top=H*0.42; bottom=H-pad; }

  const r=fitText(x,q,tw,area.h,W*0.085,W*0.035,700,QF,1.18); x.fillStyle=ink; x.font=`700 ${r.fs}px ${QF}`;
  const blockH=r.lines.length*r.fs*1.18, y0= sty==="color"? area.y+(area.h-blockH)/2 : area.y+area.h-blockH;
  r.lines.forEach((l,i)=>x.fillText(l,tx,y0+r.fs*(i+0.95)+i*r.fs*0.18));

  x.fillStyle=ink; x.font=`700 ${W*0.04}px ${NF}`; x.fillText($("#n").value,nx,bottom-nameH*0.42);
  x.fillStyle=sub; x.font=`500 ${W*0.03}px ${NF}`; x.fillText($("#c").value,nx,bottom-nameH*0.02);
  if(logo){ const lh=W*0.08, lw=lh*logo.width/logo.height; x.drawImage(logo,W-pad-lw,pad*0.8,lw,lh); }
}
["q","n","c","ac","hl"].forEach(k=>$("#"+k).addEventListener("input",draw));
$("#ph").addEventListener("change",async e=>{ const f=e.target.files[0]; if(!f) return; try{ photo=await readImage(f); $("#nt").textContent="Revisa que la cita sea textual y que la persona haya autorizado el uso de su imagen."; draw(); }catch(_){ toast("No se pudo abrir la foto"); } });
$("#lg").addEventListener("change",async e=>{ const f=e.target.files[0]; if(!f) return; try{ logo=await readImage(f); draw(); }catch(_){ toast("No se pudo abrir el logo"); } });

})();
