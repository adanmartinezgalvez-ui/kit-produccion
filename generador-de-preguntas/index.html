  S.forEach(s=>{ const base=[...(BANK[st.fmt][s]||[])];
    if(st.fmt==="fondo") (GUEST[st.inv].x[s]||[]).forEach(q=>base.splice(Math.min(base.length,2),0,q));
    if(st.fmt==="testimonio") (ARQ[st.arq][s]||[]).forEach(q=>base.push(q));
    base.forEach(q=>out.push({s,q:fill(q),src:"base"}));
    st.extra.filter(e=>e.f===st.fmt&&e.s===s).forEach(e=>out.push({s,q:e.q,src:e.src,id:e.id})); });
  return out;
}
function render(){
  $("#arqF").hidden=st.fmt!=="testimonio";
  const it=items(), S=STAGES[st.fmt]; let on=0;
  $("#list").innerHTML=S.map(s=>{ const rows=it.filter(i=>i.s===s); return `<div class="stage"><h3>${esc(s)}</h3>${rows.map(r=>{ const k=st.fmt+"|"+r.q, ck=!st.off[k]; if(ck) on++;
    return `<label class="q"><input type="checkbox" data-k="${esc(k)}"${ck?" checked":""}><span>${esc(r.q)}</span>${r.src!=="base"?`<span class="tag">${r.src==="ia"?"Claude":"Tuya"}</span><button type="button" class="x" data-id="${r.id}" aria-label="Quitar">×</button>`:""}</label>`; }).join("")}</div>`; }).join("");
  $("#cnt").textContent=`${on} de ${it.length} marcadas`;
  $$("#list input").forEach(c=>c.addEventListener("change",()=>{ if(c.checked) delete st.off[c.dataset.k]; else st.off[c.dataset.k]=1; save(); render(); }));
  $$("#list .x").forEach(b=>b.addEventListener("click",e=>{ e.preventDefault(); st.extra=st.extra.filter(x=>String(x.id)!==b.dataset.id); save(); render(); }));
  $("#ownSt").innerHTML=S.map(s=>`<option>${esc(s)}</option>`).join("");
  const g=GUEST[st.inv];
  const t2 = st.fmt==="voxpop" ? "Busca variedad de edades y lugares. Pide permiso antes de grabar y haz la misma pregunta a todas las personas para poder editarlas juntas."
    : st.fmt==="pingpong" ? "Ritmo rápido: lee la pregunta y espera la respuesta sin comentar. En edición se cortan juntas y funcionan muy bien en redes." : g.tip;
  $("#tips").innerHTML=`<h2>Consejos</h2><p>Pide respuestas completas que repitan la pregunta («${esc(fill("{t}"))} es…»): tu voz no saldrá en el corte.</p><p>Después de cada respuesta, espera dos segundos en silencio. Muchas veces ahí sale lo mejor.</p><p>${esc(t2)}</p>`;
}
$("#addOwn").addEventListener("click",()=>{ const q=$("#own").value.trim(); if(!q) return; st.extra.push({id:Date.now(),f:st.fmt,s:$("#ownSt").value,q,src:"tuya"}); $("#own").value=""; save(); render(); });
$("#own").addEventListener("keydown",e=>{ if(e.key==="Enter") $("#addOwn").click(); });
$("#copy").addEventListener("click",()=>{ const it=items().filter(r=>!st.off[st.fmt+"|"+r.q]); if(!it.length){ toast("Marca al menos una pregunta"); return; } let n=0, out=`Entrevista: ${st.tema}\n`;
  STAGES[st.fmt].forEach(s=>{ const r=it.filter(i=>i.s===s); if(!r.length) return; if(STAGES[st.fmt].length>1) out+=`\n${s.toUpperCase()}\n`; r.forEach(i=>out+=`${++n}. ${i.q}\n`); }); copyText(out.trim()); });
// Claude, cuando está disponible
let sample=null;
(async()=>{ try{ sample=(window.claude&&window.claude.use)? await window.claude.use("sample") : null; }catch(_){ sample=null; } $("#ai").hidden=!sample; })();
$("#ai").addEventListener("click", async ()=>{
  if(!sample) return; const b=$("#ai"), S=STAGES[st.fmt]; b.disabled=true; $("#aiMsg").textContent="Pensando…";
  const ex=items().map(i=>"- "+i.q).join("\n");
  const prompt=`Eres productor de video institucional en México. Propón 6 preguntas nuevas, en español de México, para ${FDESC[st.fmt]} con ${st.fmt==="fondo"||st.fmt==="testimonio"?GUEST[st.inv].l:"personas en la calle"} sobre «${st.tema||"el tema"}». Deben ser abiertas, concretas, fáciles de responder ante cámara y respetuosas. No repitas ni parafrasees estas:\n${ex}\n\nResponde solo con un arreglo JSON de objetos {"etapa": string, "pregunta": string}. "etapa" debe ser exactamente una de: ${S.map(s=>`"${s}"`).join(", ")}.`;
  try{ const arr=await sample.json(prompt,{modelTier:"quick",cache:false}); let k=0;
    (Array.isArray(arr)?arr:[]).forEach(o=>{ const q=String(o&&o.pregunta||"").trim(); if(!q) return; const s=S.includes(o.etapa)?o.etapa:S[Math.min(S.length-1,1)]; st.extra.push({id:Date.now()+(k++),f:st.fmt,s,q,src:"ia"}); });
    save(); render(); $("#aiMsg").textContent= k? `Claude agregó ${k} preguntas.` : "No llegaron preguntas nuevas; intenta de nuevo.";
  }catch(e){ const c=e&&e.code; if(["not_granted","sampling_disabled","not_declared","capability_disabled","capability_removed"].includes(c)){ b.hidden=true; $("#aiMsg").textContent="Las ideas con Claude no están disponibles aquí."; }
    else if(c==="rate_limited") $("#aiMsg").textContent="Demasiadas solicitudes; espera un momento.";
    else if(c==="cancelled") $("#aiMsg").textContent=""; else $("#aiMsg").textContent="No se pudo; vuelve a intentarlo."; }
  b.disabled=false;
});
render();

})();
</script>

</body></html>
