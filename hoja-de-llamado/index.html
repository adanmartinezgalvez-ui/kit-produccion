<style>

.sh-grid span,.sh-notes span{font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}
.sh-grid p,.sh-notes p{margin:2px 0 0;white-space:pre-wrap}
.sh-grid a{color:var(--accent-ink)}
</style>
<div class="app">
<header class="hd"><span class="eyebrow">Kit de producción</span><h1>Hoja de Llamado</h1><p class="sub">Llena los datos del rodaje y compártelos por WhatsApp con formato listo.</p></header>

<div class="grid">
  <div class="card">
    <h2>Datos del rodaje</h2>
    <label class="f">Proyecto<input type="text" id="proj" value="Cápsula institucional: simulacro"></label>
    <div class="cols">
      <label class="f">Fecha<input type="date" id="date"></label>
      <label class="f">Hora de llamado<input type="time" id="call" value="07:30"></label>
    </div>
    <label class="f">Locación<input type="text" id="loc" value="Explanada del edificio sede, acceso por puerta 2"></label>
    <label class="f">Liga del mapa <small>opcional</small><input type="url" id="map" placeholder="https://maps.app.goo.gl/…"></label>
    <div class="cols">
      <label class="f">Contacto en sitio<input type="text" id="cont" value="Producción · 55 0000 0000"></label>
      <label class="f">Clima<input type="text" id="wx" value="Soleado, 24 °C (confirmar)"></label>
    </div>
    <label class="f">Equipo <small>Nombre | Rol | Hora</small><textarea class="mono" id="crew">Laura M. | Dirección | 07:30
Pedro S. | Cámara A | 07:00
Rosa T. | Sonido | 07:00
Iván R. | Asistente | 07:00</textarea></label>
    <label class="f">Plan del día <small>Hora | Actividad</small><textarea class="mono" id="plan">07:00 | Llegada de equipo técnico y montaje
07:30 | Llamado general
08:00 | Escena 1: entrevistas
10:30 | Escena 2: tomas de apoyo del simulacro
13:00 | Comida
14:00 | Escena 3: mensajes a cámara
16:00 | Fin de rodaje</textarea></label>
    <label class="f">Notas<textarea id="notes" style="min-height:70px">Traer identificación. Vestimenta sin logos. Estacionamiento limitado.</textarea></label>
    <p class="note">Datos de ejemplo: reemplázalos con los tuyos. Se guardan en este navegador.</p>
  </div>
  <div class="card">
    <div class="row" style="justify-content:space-between"><h2>Vista previa</h2><button class="btn" type="button" id="copy">Copiar para WhatsApp</button></div>

<script>
(function(){

const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
const store={get(k,d){try{const v=localStorage.getItem(k);return v==null?d:JSON.parse(v)}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
function toast(t){ let el=$(".toast"); if(!el){ el=document.createElement("div"); el.className="toast"; el.setAttribute("role","status"); document.body.appendChild(el); } el.textContent=t; el.hidden=false; clearTimeout(toast._t); toast._t=setTimeout(()=>el.hidden=true,2600); }
function seg(el, v, cb){ const set=val=>el.querySelectorAll("button").forEach(b=>b.setAttribute("aria-pressed", String(b.dataset.v===String(val)))); set(v); el.addEventListener("click",e=>{ const b=e.target.closest("button"); if(!b) return; set(b.dataset.v); cb(b.dataset.v); }); return set; }
let _dl=null; function dl(){ if(!_dl) _dl=(window.claude&&window.claude.use)?window.claude.use("downloads").catch(()=>null):Promise.resolve(null); return _dl; }
async function copyText(t){ try{ await navigator.clipboard.writeText(t); toast("Copiado"); return true; }catch(e){ const ta=document.createElement("textarea"); ta.value=t; ta.style.position="fixed"; ta.style.opacity="0"; document.body.appendChild(ta); ta.select(); let ok=false; try{ ok=document.execCommand("copy"); }catch(_){} ta.remove(); toast(ok?"Copiado":"Selecciona el texto y cópialo a mano"); return ok; } }
function fallbackBox(){ let fb=$("#fallback"); if(!fb){ fb=document.createElement("div"); fb.id="fallback"; fb.className="card fb"; $(".app").appendChild(fb); } fb.innerHTML=""; fb.hidden=false; return fb; }
async function showFallback(name, data){
  const fb=fallbackBox(); const h=document.createElement("h2"); h.textContent="Guardar a mano"; fb.appendChild(h);
  const p=document.createElement("p"); p.className="note"; fb.appendChild(p);
  if(data instanceof Blob && data.type.startsWith("image/")){ p.textContent="Aquí no se puede descargar directo. Mantén presionada la imagen (o clic derecho › Guardar imagen)."; const img=document.createElement("img"); img.alt=name; img.src=await new Promise(r=>{const fr=new FileReader(); fr.onload=()=>r(fr.result); fr.readAsDataURL(data);}); fb.appendChild(img); }
  else if(typeof data==="string"){ p.textContent="Aquí no se puede descargar directo. Copia el contenido:"; const ta=document.createElement("textarea"); ta.className="mono"; ta.value=data; ta.readOnly=true; fb.appendChild(ta); const b=document.createElement("button"); b.className="btn ghost sm"; b.type="button"; b.textContent="Copiar"; b.onclick=()=>copyText(data); fb.appendChild(b); }
  else { p.textContent="Aquí no se puede descargar este archivo. Abre la página dentro de claude.ai para guardarlo."; }
  fb.scrollIntoView({behavior:"smooth", block:"nearest"});
}
async function saveFile(name, data){
  const d=await dl();
  if(!d){ await showFallback(name, data); return false; }
  try{ await d.save({filename:name, data}); toast("Listo: "+name); return true; }
  catch(e){ const c=e&&e.code; if(c==="declined"){ toast("Descarga cancelada"); return false; } if(c==="rate_limited"){ toast("Ya hay una descarga pendiente"); return false; } await showFallback(name, data); return false; }
}
function canvasBlob(c, type, q){ return new Promise(r=>c.toBlob(r, type||"image/png", q)); }
function slug(t){ return (t||"archivo").normalize("NFD").replace(/[̀-ͯ]/g,"").toLowerCase().replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"").slice(0,60)||"archivo"; }
function readImage(file){ return new Promise((res,rej)=>{ const url=URL.createObjectURL(file); const im=new Image(); im.onload=()=>res(im); im.onerror=rej; im.src=url; }); }
function sampleImage(w,h,seed){
  // Escena de ejemplo generada (no es una foto real)
  const c=document.createElement("canvas"); c.width=w; c.height=h; const x=c.getContext("2d"); let s=seed||5; const r=()=>{ s=(s*16807)%2147483647; return s/2147483647; };
  let g=x.createLinearGradient(0,0,0,h); g.addColorStop(0,"#3d6fb6"); g.addColorStop(.55,"#f2b27a"); g.addColorStop(1,"#5a3b2e"); x.fillStyle=g; x.fillRect(0,0,w,h);
  x.fillStyle="rgba(255,236,200,.95)"; x.beginPath(); x.arc(w*.7,h*.42,h*.09,0,7); x.fill();
  for(let i=0;i<9;i++){ x.fillStyle=`rgba(${30+i*6},${34+i*5},${48+i*4},.92)`; const bw=w*(.07+r()*.08), bh=h*(.2+r()*.35); x.fillRect(i*w*.115, h*.62-bh, bw, bh+2); }

  x.fillStyle="#1b1a18"; x.beginPath(); x.arc(w*.36,h*.52,h*.05,0,7); x.fill(); x.fillRect(w*.33,h*.56,w*.06,h*.2);
  return c;
}


const F=["proj","date","call","loc","map","cont","wx","crew","plan","notes"];
const d=new Date(); d.setDate(d.getDate()+1); $("#date").value=d.toISOString().slice(0,10);
const S=store.get("hl-v1",null); if(S) F.forEach(k=>{ if(S[k]!=null) $("#"+k).value=S[k]; });
const rows=t=>t.split("\n").map(l=>l.split("|").map(x=>x.trim())).filter(r=>r[0]);
const esc=t=>String(t).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
function nice(dt){ if(!dt) return ""; const [y,m,dd]=dt.split("-").map(Number); return new Date(y,m-1,dd).toLocaleDateString("es-MX",{weekday:"long",day:"numeric",month:"long",year:"numeric"}); }
function render(){
  const v={}; F.forEach(k=>v[k]=$("#"+k).value); store.set("hl-v1",v);
  const crew=rows(v.crew), plan=rows(v.plan);
  $("#sheet").innerHTML=`<div class="sh-top"><div><div class="sh-proj">${esc(v.proj)}</div><div class="sh-date">${esc(nice(v.date))}</div></div><div class="sh-call"><span>Llamado</span><b>${esc(v.call)}</b></div></div>
  <div class="sh-grid"><div><span>Locación</span><p>${esc(v.loc)}${v.map?`<br><a href="${esc(v.map)}" target="_blank" rel="noopener">Ver mapa</a>`:""}</p></div><div><span>Contacto</span><p>${esc(v.cont)}</p></div><div><span>Clima</span><p>${esc(v.wx)}</p></div></div>
  <div class="tbl"><table><thead><tr><th>Equipo</th><th>Rol</th><th class="n">Hora</th></tr></thead><tbody>${crew.map(r=>`<tr><td>${esc(r[0])}</td><td>${esc(r[1]||"")}</td><td class="n">${esc(r[2]||v.call)}</td></tr>`).join("")}</tbody></table></div>
  <div class="tbl"><table><thead><tr><th class="n" style="width:70px">Hora</th><th>Plan</th></tr></thead><tbody>${plan.map(r=>`<tr><td class="n">${esc(r[0])}</td><td>${esc(r[1]||"")}</td></tr>`).join("")}</tbody></table></div>
  ${v.notes?`<div class="sh-notes"><span>Notas</span><p>${esc(v.notes)}</p></div>`:""}`;
}
function wa(){
  const v={}; F.forEach(k=>v[k]=$("#"+k).value);
  let t=`🎬 *HOJA DE LLAMADO*\n*${v.proj}*\n📅 ${nice(v.date)}\n⏰ Llamado: *${v.call}*\n📍 ${v.loc}${v.map?"\n"+v.map:""}\n📞 ${v.cont}\n🌤️ ${v.wx}\n\n*EQUIPO*\n`;
  t+=rows(v.crew).map(r=>`• ${r[0]} — ${r[1]||""} (${r[2]||v.call})`).join("\n");
  t+=`\n\n*PLAN*\n`+rows(v.plan).map(r=>`${r[0]}  ${r[1]||""}`).join("\n");
  if(v.notes) t+=`\n\n*NOTAS*\n${v.notes}`;
  return t;

F.forEach(k=>$("#"+k).addEventListener("input",render));
$("#copy").addEventListener("click",()=>copyText(wa()));
render();

})();
</script>
