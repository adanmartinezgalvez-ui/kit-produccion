<div class="app">
<header class="hd"><span class="eyebrow">Kit de producción</span><h1>Marca de Agua en Lote</h1><p class="sub">Pon tu logo o un texto en muchas fotos a la vez y descárgalas en un .zip.</p></header>

    <div class="preview"><canvas id="pv"></canvas></div>
    <div class="thumbs" id="thumbs"></div>
    <div class="row"><button class="btn" type="button" id="go">Descargar todas (.zip)</button></div>
    <p class="note" id="note">Fotos de ejemplo. Las fotos se procesan en tu dispositivo y conservan su tamaño original.</p>

</div>

</div>
