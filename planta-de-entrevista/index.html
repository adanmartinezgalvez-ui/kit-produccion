  return {g,w,h};
}
function draw(){ const {g,w,h}=svgStr(false), s=$("#plan"); s.setAttribute("viewBox",`0 0 ${w} ${h}`); s.innerHTML=g; checks(); }
function checks(){
  const out=[]; const S=E.S;
  const wall=Math.min(S[0],S[1],W-S[0],L-S[1]); out.push([wall>=1.2?"ok":"warn",`Entrevistado a ${wall.toFixed(1)} m de la pared más cercana`, wall>=1.2? "Bien: el fondo se separa y no hay sombra en la pared." : "Aléjalo al menos 1.2 m del fondo para separar y desenfocar."]);
  if(mode!=="camara"){ const d=sub(E.I,E.S), sa=Math.sign(cross(d,sub(E.A,E.S))), sb=Math.sign(cross(d,sub(E.B,E.S)));
    out.push([sa===sb?"ok":"bad","Línea de 180°", sa===sb? "Las dos cámaras están del mismo lado de la línea roja." : "Una cámara cruzó la línea roja: al cortar, las personas parecerán mirar al mismo lado."]); }
  const tA=face("A"), tB=face("B");
  if(mode!=="conv"){ const ab=ang(sub(E.A,S),sub(E.B,S)); out.push([ab>=25?"ok":"warn",`Ángulo entre cámaras: ${Math.round(ab)}°`, ab>=25? "Suficiente diferencia para cortar entre A y B." : "Muy parecidas: el corte de A a B se verá como un salto. Sepáralas más de 25°."]); }
  const ka=ang(sub(E.K,S),sub(E.A,S)); out.push([ka>=25&&ka<=70?"ok":"warn",`Luz principal a ${Math.round(ka)}° de la cámara A`, ka>=25&&ka<=70? "Buen modelado del rostro." : ka<25? "Muy de frente: el rostro se ve plano. Muévela hacia un lado (30–60°)." : "Muy de lado: media cara quedará en sombra fuerte."]);
  const dA=len(sub(tA,E.A)), dB=len(sub(tB,E.B));
  out.push(["info",`Cámara A a ${dA.toFixed(1)} m`, `Plano medio: unos ${Math.round(dA*30/5)*5} mm en full frame (${Math.round(dA*30/1.5/5)*5} mm en APS-C).`]);
  out.push(["info",`Cámara B a ${dB.toFixed(1)} m`, `Primer plano: unos ${Math.round(dB*53/5)*5} mm en full frame (${Math.round(dB*53/1.5/5)*5} mm en APS-C).`]);
  $("#checks").innerHTML=out.map(([c,t,d])=>`<div class="ck ${c}"><b>${t}</b><span>${d}</span></div>`).join("");
  $("#legend").innerHTML=Object.keys(TYPES).map(k=>`<span><i style="background:${TYPES[k][2]}"></i>${TYPES[k][0]}</span>`).join("")+(mode!=="camara"?`<span><i class="dash"></i>Línea de 180°</span>`:"");
}
let drag=null; const svg=$("#plan");
function pt(e){ const m=svg.getScreenCTM(); if(!m) return null; const p=new DOMPoint(e.clientX,e.clientY).matrixTransform(m.inverse()); return [(p.x-PAD)/PX,(p.y-PAD)/PX]; }
svg.addEventListener("pointerdown",e=>{ const gEl=e.target.closest("g[data-k]"); if(!gEl) return; drag=gEl.dataset.k; svg.setPointerCapture(e.pointerId); e.preventDefault(); });
svg.addEventListener("pointermove",e=>{ if(!drag) return; const p=pt(e); if(!p) return; E[drag]=[Math.max(.2,Math.min(W-.2,p[0])),Math.max(.2,Math.min(L-.2,p[1]))]; draw(); });
const end=()=>{ drag=null; }; svg.addEventListener("pointerup",end); svg.addEventListener("pointercancel",end);
seg($("#mode"),mode,v=>{ mode=v; layout(); draw(); });
["W","L"].forEach(k=>$("#"+k).addEventListener("change",()=>{ W=Math.max(2.5,Math.min(15,+$("#W").value||5)); L=Math.max(2.5,Math.min(15,+$("#L").value||6)); layout(); draw(); }));
$("#reset").addEventListener("click",()=>{ layout(); draw(); });
$("#png").addEventListener("click", async ()=>{ const {g,w,h}=svgStr(true); const s=`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${w} ${h}" width="${w*2}" height="${h*2}">${g}</svg>`;
  const im=new Image(); im.onload=async()=>{ const c=document.createElement("canvas"); c.width=w*2; c.height=h*2; c.getContext("2d").drawImage(im,0,0); saveFile("planta-entrevista.png", await canvasBlob(c)); };
  im.src="data:image/svg+xml;charset=utf-8,"+encodeURIComponent(s); });
layout(); draw();

})();
</script>
