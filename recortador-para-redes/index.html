<div class="app">
<header class="hd"><span class="eyebrow">Kit de producción</span><h1>Recortador para Redes</h1><p class="sub">Sube una foto, toca el punto importante y sácala en todos los formatos de redes de una vez.</p></header>

<div class="grid wide">
  <div class="card">
    <h2>Foto original</h2>
    <input type="file" id="file" accept="image/*" aria-label="Elegir foto">
    <div class="preview" style="position:relative;cursor:crosshair"><canvas id="src" aria-label="Toca para elegir el punto de interés"></canvas><div id="dot" class="dot"></div></div>
    <p class="note" id="srcNote">Imagen de ejemplo. Toca la foto para marcar el punto que siempre debe quedar dentro del recorte.</p>
    <label class="f">Acercamiento <small id="zv"></small><input type="range" id="zoom" min="100" max="200" value="100"></label>
  </div>
  <div class="card">
    <div class="row" style="justify-content:space-between"><h2>Formatos</h2><button class="btn" type="button" id="all">Descargar todos (.zip)</button></div>
    <div class="crops" id="crops"></div>
  </div>
</div>

</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script><script>
(function(){

const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
const store={get(k,d){try{const v=localStorage.getItem(k);return v==null?d:JSON.parse(v)}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};

function seg(el, v, cb){ const set=val=>el.querySelectorAll("button").forEach(b=>b.setAttribute("aria-pressed", String(b.dataset.v===String(val)))); set(v); el.addEventListener("click",e=>{ const b=e.target.closest("button"); if(!b) return; set(b.dataset.v); cb(b.dataset.v); }); return set; }

function fallbackBox(){ let fb=$("#fallback"); if(!fb){ fb=document.createElement("div"); fb.id="fallback"; fb.className="card fb"; $(".app").appendChild(fb); } fb.innerHTML=""; fb.hidden=false; return fb; }
async function showFallback(name, data){
  const fb=fallbackBox(); const h=document.createElement("h2"); h.textContent="Guardar a mano"; fb.appendChild(h);
  const p=document.createElement("p"); p.className="note"; fb.appendChild(p);
  if(data instanceof Blob && data.type.startsWith("image/")){ p.textContent="Aquí no se puede descargar directo. Mantén presionada la imagen (o clic derecho › Guardar imagen)."; const img=document.createElement("img"); img.alt=name; img.src=await new Promise(r=>{const fr=new FileReader(); fr.onload=()=>r(fr.result); fr.readAsDataURL(data);}); fb.appendChild(img); }
  else if(typeof data==="string"){ p.textContent="Aquí no se puede descargar directo. Copia el contenido:"; const ta=document.createElement("textarea"); ta.className="mono"; ta.value=data; ta.readOnly=true; fb.appendChild(ta); const b=document.createElement("button"); b.className="btn ghost sm"; b.type="button"; b.textContent="Copiar"; b.onclick=()=>copyText(data); fb.appendChild(b); }

async function saveFile(name, data){
  const d=await dl();

  catch(e){ const c=e&&e.code; if(c==="declined"){ toast("Descarga cancelada"); return false; } if(c==="rate_limited"){ toast("Ya hay una descarga pendiente"); return false; } await showFallback(name, data); return false; }

function canvasBlob(c, type, q){ return new Promise(r=>c.toBlob(r, type||"image/png", q)); }

  // Escena de ejemplo generada (no es una foto real)
  const c=document.createElement("canvas"); c.width=w; c.height=h; const x=c.getContext("2d"); let s=seed||5; const r=()=>{ s=(s*16807)%2147483647; return s/2147483647; };

}


const FMT=[["Instagram cuadrado",1080,1080],["Instagram vertical 4:5",1080,1350],["Historia / Reel 9:16",1080,1920],["Facebook horizontal",1200,630],["X (Twitter)",1600,900],["Miniatura YouTube",1280,720]];
let img=sampleImage(1600,1000,9), name="ejemplo", fx=.4, fy=.55;
const src=$("#src");
function drawSrc(){ const w=img.width, h=img.height, s=Math.min(1, 900/w); src.width=Math.round(w*s); src.height=Math.round(h*s); src.getContext("2d").drawImage(img,0,0,src.width,src.height); const d=$("#dot"); d.style.left=(fx*100)+"%"; d.style.top=(fy*100)+"%"; }

  const sx=Math.min(Math.max(fx*iw-cw/2,0),iw-cw), sy=Math.min(Math.max(fy*ih-ch/2,0),ih-ch); const x=c.getContext("2d"); x.imageSmoothingQuality="high"; x.drawImage(img,sx,sy,cw,ch,0,0,c.width,c.height); }

    fig.appendChild(c); const cap=document.createElement("figcaption"); cap.innerHTML=`<span>${n}</span><span class="tag">${W}×${H}</span>`; fig.appendChild(cap);

}
async function full(i){ const [n,W,H]=FMT[i]; const c=document.createElement("canvas"); c.width=W; c.height=H; crop(c,W,H); return {fn:`${slug(name)}-${slug(n)}.jpg`, blob:await canvasBlob(c,"image/jpeg",.92)}; }

drawSrc(); renderCrops();

})();
</script>
