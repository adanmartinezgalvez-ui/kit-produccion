:root {
  --font-display: "Archivo Narrow", "Arial Narrow", Arial, sans-serif;

  /* ---------- Almacenamiento ---------- */
  function stripSite(site) {

  function makeDbBackend(db) {
    var sites = db.collection('sitios');
    var photosOf = function (id) { return sites.doc(id).collection('fotos'); };
    var self = {
      kind: 'db',
      subscribe: function (cb, onErr) {
        return sites.onSnapshot(function (snap) {
          cb(snap.docs.map(function (d) { return Object.assign({ id: d.id }, d.data()); }));
        }, onErr);
      },
      getPhotos: function (id) {
        return photosOf(id).get().then(function (snap) {
          return snap.docs.map(function (d) { return Object.assign({ id: d.id }, d.data()); })
            .sort(function (a, b) { return (a.orden || 0) - (b.orden || 0); });
        });
      },
      save: async function (site, add, removeIds) {
        for (var i = 0; i < removeIds.length; i++) await photosOf(site.id).doc(removeIds[i]).delete();
        for (var j = 0; j < add.length; j++) {
          var p = add[j];
          await photosOf(site.id).doc(p.id).set({ src: p.src, thumb: p.thumb, w: p.w, h: p.h, orden: p.orden });
        }
        await sites.doc(site.id).set(stripSite(site));
      },
      remove: async function (id) {
        var ph = await self.getPhotos(id);
        for (var i = 0; i < ph.length; i++) await photosOf(id).doc(ph[i].id).delete();
        await sites.doc(id).delete();
      }
    };
    return self;
  }
  function makeLocalBackend() {
    var K = 'scouting-locaciones:sitios', P = 'scouting-locaciones:fotos:';
    var ok = true, mem = {};
    try { localStorage.setItem('__t', '1'); localStorage.removeItem('__t'); } catch (e) { ok = false; }
    var get = function (k) { return ok ? localStorage.getItem(k) : (mem[k] == null ? null : mem[k]); };
    var set = function (k, v) { if (ok) localStorage.setItem(k, v); else mem[k] = v; };
    var del = function (k) { if (ok) localStorage.removeItem(k); else delete mem[k]; };
    var readSites = function () { try { return JSON.parse(get(K) || '[]'); } catch (e) { return []; } };
    var subs = [];
    var emit = function () { var a = readSites(); subs.forEach(function (f) { f(a); }); };
    var self = {
      kind: 'local',
      subscribe: function (cb) { subs.push(cb); cb(readSites()); return function () { subs = subs.filter(function (f) { return f !== cb; }); }; },
      getPhotos: async function (id) {
        try { return JSON.parse(get(P + id) || '[]').sort(function (a, b) { return (a.orden || 0) - (b.orden || 0); }); } catch (e) { return []; }
      },
      save: async function (site, add, removeIds) {
        var photos = (await self.getPhotos(site.id)).filter(function (p) { return removeIds.indexOf(p.id) < 0; });
        add.forEach(function (p) { photos.push({ id: p.id, src: p.src, thumb: p.thumb, w: p.w, h: p.h, orden: p.orden }); });
        set(P + site.id, JSON.stringify(photos));
        var arr = readSites().filter(function (s) { return s.id !== site.id; });
        arr.push(JSON.parse(JSON.stringify(site)));
        set(K, JSON.stringify(arr));
        emit();
      },
      remove: async function (id) {
        del(P + id);
        set(K, JSON.stringify(readSites().filter(function (s) { return s.id !== id; })));
        emit();
      }
    };
    return self;
  }

  app.addEventListener('click', function (e) {
    var t = e.target.closest('[data-act]');
    if (t && handlers[t.dataset.act]) handlers[t.dataset.act](t, e);
  });
  app.addEventListener('input', function (e) {
    if (e.target.id === 'q') { state.q = e.target.value; renderListItems(); return; }
    var f = e.target.getAttribute && e.target.getAttribute('data-f');
    if (f && state.draft) state.draft[f] = e.target.value;
  });
  $('#file-in').addEventListener('change', function (e) { if (e.target.files && e.target.files.length) handleFiles(e.target.files); });
  $('#lb').addEventListener('click', function (e) {
    var b = e.target.closest('[data-lb]');
    var zoomed = $('#lb').classList.contains('zoomed');
    if (b) {
      var a = b.dataset.lb;
      if (a === 'close') closeLb();
      else if (a === 'zoom') setZoom(!zoomed);
      else if (a === 'dl') downloadPhoto();
      else stepLb(a === 'next' ? 1 : -1);
    } else if (e.target.id === 'lb-img') setZoom(!zoomed);
    else if (e.target.id === 'lb' && !zoomed) closeLb();
  });
  document.addEventListener('keydown', function (e) {
    if ($('#lb').hidden) return;
    if (e.key === 'Escape') closeLb();
    else if (e.key === 'ArrowRight' && state.photos.length > 1) stepLb(1);
    else if (e.key === 'ArrowLeft' && state.photos.length > 1) stepLb(-1);
  });
  document.querySelector('[data-lb="close"]').innerHTML = ICON.xl;
  document.querySelector('[data-lb="prev"]').innerHTML = ICON.prev;
  document.querySelector('[data-lb="next"]').innerHTML = ICON.next;
  document.querySelector('[data-lb="zoom"]').innerHTML = ICON.zoom;

  /* ---------- Arranque ---------- */
  function onSitesChanged() {
    if (state.view === 'list') {
      if ($('#q') && document.activeElement === $('#q')) { renderListItems(); updateCount(); } else renderList();
      return;
    }
    if (state.view === 'detail') {
      var s = activeSite();
      if (!s) { state.activeId = null; go('list'); return; }
      renderDetail();
      if (state.photosLoaded && s.numFotos !== state.photos.length) { state.photosLoaded = false; refreshPhotos(); loadPhotos(s.id); }
    }
  }
  async function boot() {
    renderList();
    var use = (window.claude && typeof window.claude.use === 'function')
      ? function (n) { return Promise.resolve(window.claude.use(n)).catch(function () { return null; }); }
      : function () { return Promise.resolve(null); };
    var got = await Promise.all([use('db'), use('user'), use('downloads')]);
    var db = got[0], user = got[1];
    downloads = got[2] || null;
    if (db) {
      state.backend = makeDbBackend(db);
      if (user && typeof user.can === 'function') {
        try { if ((await user.can('data.write')) === false) state.readOnly = true; } catch (e) { /* se decide al guardar */ }
      }
    } else {
      state.backend = makeLocalBackend();
      state.notice = 'Los sitios se guardan solo en este navegador y dispositivo. Inicia sesión en Claude para guardarlos en tu cuenta y verlos desde otros dispositivos.';
    }
    state.backend.subscribe(function (sites) {
      state.sites = sites; state.loading = false; onSitesChanged();
    }, function () {
      state.loading = false; state.notice = 'No se pudieron leer los sitios guardados. Recarga la página para intentarlo de nuevo.'; onSitesChanged();
    });
  }
  boot();
})();
</script>

</body></html>
